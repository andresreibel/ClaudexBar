name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install icon tooling
        run: brew install librsvg
      - name: Test shared engine and macOS app
        run: make test
      - name: Build application bundle
        run: make app
      - name: Verify application bundle
        run: |
          plutil -lint .build/ClaudexBar.app/Contents/Info.plist
          codesign --verify --deep --strict .build/ClaudexBar.app

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Test shared engine
        run: bun test
      - name: Build shared engine
        run: bun build claudexbar.ts --target=bun --outdir .build/bun-check
      - name: Validate installer
        run: |
          bash -n install.sh
          ./install.sh --help
